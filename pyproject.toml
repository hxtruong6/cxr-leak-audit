[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-leak-audit"
version = "0.1.1"
description = "Information-theoretic co-occurrence leakage audit for multi-label open-set recognition splits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "truong dev", email = "hxtruong6ac@gmail.com" }
]
keywords = ["open-set-recognition", "data-leakage", "mutual-information", "benchmark", "chest-x-ray", "multi-label", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "tomli>=2; python_version<'3.11'",
    "mypy>=1.10",
]

[project.scripts]
cxr-leak-audit = "cxr_leak_audit.cli:main"

[project.urls]
Homepage = "https://github.com/hxtruong6/cxr-leak-audit"
Repository = "https://github.com/hxtruong6/cxr-leak-audit"
Issues = "https://github.com/hxtruong6/cxr-leak-audit/issues"
Changelog = "https://github.com/hxtruong6/cxr-leak-audit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["cxr_leak_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
files = ["cxr_leak_audit"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*"]
ignore_missing_imports = true
